[server]
headless = true
maxUploadSize = 200   # nur für Sicherungen; die übrigen Upload-Felder begrenzen auf 10 MB

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"     # kein „Deploy“-Knopf / Entwicklermenü

[theme]   # immer hell mit dunkler Schrift (kein Mischmasch aus Windows-Dunkelmodus und weißen Flächen)
base = "light"
primaryColor = "#0F5F6E"            # Petrol (wie die PDFs)
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF3F4"
textColor = "#1B2329"

# Port bei Hostern (Railway/Render …) per Startbefehl setzen:
#   streamlit run app.py --server.port $PORT
