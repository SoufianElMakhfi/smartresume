# Baut SmartResume.exe und hängt sie an das GitHub-Release.
# (Kein zusätzliches Build-Artefakt: Private Repos haben nur 500 MB Artefakt-Speicher, die .exe hat ~140 MB.)
# Auslösen: Tag pushen, z. B.  git tag v1.0.0 && git push origin v1.0.0
name: Release (Windows-EXE)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        run: python -m pytest -q
      - name: EXE bauen
        run: python build_exe.py
      - name: EXE-Selbsttest (Module, PDF, Startseite)
        run: dist\SmartResume.exe --selftest
      - name: An Release anhängen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SmartResume.exe
