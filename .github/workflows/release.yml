# Baut und testet SmartResume.exe und baut das Store-Paket (.msix).
# Die .exe wird bewusst NICHT veröffentlicht: Einziger offizieller Download ist der Microsoft Store
# (signiert, automatische Updates). Die .exe wird nur gebaut, um den Build zu prüfen.
# Auslösen: Tag pushen (z. B.  git tag v2.1.1 && git push origin v2.1.1 → MSIX mit Version 2.1.1.0)
# oder Actions → „Release“ → „Run workflow“.
name: Release (Windows-EXE)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        run: python -m pytest -q
      - name: EXE bauen
        run: python build_exe.py
      - name: EXE-Selbsttest (Module, PDF, Startseite)
        shell: pwsh
        run: ./packaging/selftest.ps1 dist\SmartResume.exe

  # Store-Paket für Partner Center. Nur als Download unter „Actions → Lauf → Artifacts“ (7 Tage),
  # wird nicht veröffentlicht – Hochladen und Einreichen passiert von Hand in Partner Center.
  build-msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: MSIX bauen
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "" }
          if ($version) { python build_msix.py --version $version } else { python build_msix.py }
      - name: Selbsttest (Programm aus dem Paket)
        shell: pwsh
        run: ./packaging/selftest.ps1 build\msix\stage\SmartResume\SmartResume.exe
      - uses: actions/upload-artifact@v6
        with:
          name: SmartResume-msix
          path: dist/*.msix
          retention-days: 7
